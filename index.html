<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summa Summarum Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
      <div class="card shadow-sm" style="width: 100%; max-width: 420px">
        <div class="card-body p-4">
          <h1 class="h3 mb-1 text-center">Summa Summarum</h1>
          <p class="text-muted text-center mb-4">Prijava na portal</p>

          <div id="loginStatus" class="alert d-none" role="alert"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label" for="username">Korisnik</label>
              <input
                class="form-control"
                id="username"
                name="username"
                autocomplete="username"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Lozinka</label>
              <input
                class="form-control"
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
            <button class="btn btn-primary w-100" id="loginBtn" type="submit">
              Prijavi se
            </button>
          </form>
        </div>
      </div>
    </main>

    <script src="login.js"></script>
  </body>
</html>
